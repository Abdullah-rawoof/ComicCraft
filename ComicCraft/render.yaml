services:
  - type: web
    name: comiccraft
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: STABLE_DIFFUSION_MODEL
        value: black-forest-labs/FLUX.1-schnell
